services:
  app:
    image: ghcr.io/tmttn/talentenraad:${TAG:-latest}
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

networks:
  # Dual-stack, so Docker keeps the real client address for IPv6 visitors
  # (rate limiting and audit logs). Needs ip6tables, see deploy/README.md.
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:7a1e::/64

volumes:
  data:
  caddy_data:
  caddy_config:
