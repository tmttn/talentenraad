name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tmttn/talentenraad

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image tag
        id: meta
        run: |
          build_date="$(TZ=Europe/Brussels date +%F)"
          {
            echo "build_date=${build_date}"
            echo "tag=sha-${GITHUB_SHA::7}-${build_date//-/}"
            echo "sha_tag=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::DEPLOY_HOST, DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS is not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Prepare SSH
        if: steps.config.outputs.enabled == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose files
        if: steps.config.outputs.enabled == 'true'
        run: |
          opts="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          # shellcheck disable=SC2086
          scp $opts compose.yaml "deploy@${DEPLOY_HOST}:/opt/talentenraad/compose.yaml"
          # shellcheck disable=SC2086
          scp $opts deploy/Caddyfile "deploy@${DEPLOY_HOST}:/opt/talentenraad/Caddyfile"

      - name: Pull image and restart
        if: steps.config.outputs.enabled == 'true'
        run: |
          # A failed pull aborts here (set -e), so the old container keeps running.
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "deploy@${DEPLOY_HOST}" "set -e; cd /opt/talentenraad; export TAG='${TAG}'; docker compose pull app; docker compose up -d --remove-orphans; docker image prune -f"

      - name: Health check
        if: steps.config.outputs.enabled == 'true'
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://talentenraad.be/api/health

      - name: Remove SSH key
        if: always() && steps.config.outputs.enabled == 'true'
        run: rm -f ~/.ssh/deploy_key
